<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Maa Durga — Slow Light Reveal</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:Georgia,serif;color:#ffd9a8}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{width:100vw;height:100vh;object-fit:cover;display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 24px;pointer-events:none;text-align:center}
  #cap{font-size:12px;letter-spacing:.4em;color:#8a6a4a;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
  button{font-family:Georgia,serif;font-weight:700;font-size:12px;letter-spacing:.16em;cursor:pointer;
    padding:11px 22px;border-radius:999px;border:1px solid rgba(255,120,180,.5);color:#ffd9ec;background:rgba(20,4,12,.65)}
  button:hover{background:rgba(120,20,70,.6);box-shadow:0 0 22px rgba(255,60,150,.5)}
  button.primary{background:linear-gradient(135deg,#ffd9ec,#ff2d95);color:#2a0014;border:none}
  #tap{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;cursor:pointer;transition:opacity 1s ease;text-align:center;padding:24px}
  #tap.hidden{opacity:0;pointer-events:none}
  #tap h1{font-size:clamp(24px,5vw,52px);letter-spacing:.08em;
    background:linear-gradient(180deg,#fff,#ff7ac0 60%,#ff4a2d);-webkit-background-clip:text;background-clip:text;color:transparent}
  #tap p{font-size:12px;letter-spacing:.35em;color:#8a6a7a}
  body.embed #ui,body.embed #tap{display:none}
  body.embed canvas{object-fit:contain}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui">
  <div id="cap">NEON CHOKKHU DAAN &middot; SLOW LIGHT REVEAL</div>
  <div class="row">
    <button class="primary" id="replay">REPLAY REVEAL</button>
    <button id="rec">EXPORT 12s VIDEO</button>
  </div>
</div>
<div id="tap"><h1>MAA DURGA</h1><p>NEON REVEAL &middot; TAP TO LIGHT THE LAMPS</p></div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H * 0.46, S = W / 1920;
let t0 = null, started = false;
const CYCLE = 12;

/* Each stroke: path builder + neon color + timing (sec) */
function eyePath(side){ // side: -1 left, +1 right
  const ex = CX + side * 250 * S, ey = CY + 40 * S, w = 200 * S, h = 78 * S;
  ctx.beginPath();
  ctx.moveTo(ex - w, ey);
  ctx.quadraticCurveTo(ex - w * 0.3, ey - h * 1.5, ex + w, ey - h * 0.15);
  ctx.quadraticCurveTo(ex + w * 0.3, ey + h * 1.1, ex - w, ey);
}
function browPath(side){
  const ex = CX + side * 250 * S, ey = CY + 40 * S, w = 200 * S, h = 78 * S;
  ctx.beginPath();
  ctx.moveTo(ex - w * 1.05, ey - h * 0.9);
  ctx.quadraticCurveTo(ex, ey - h * 2.1, ex + w * 1.15, ey - h * 1.2);
}
function irisPath(side){
  const ex = CX + side * 250 * S, ey = CY + 40 * S;
  ctx.beginPath();
  ctx.arc(ex + side * 10 * S, ey - 4 * S, 44 * S, 0, Math.PI * 2);
}
function irisGear(side){
  const ex = CX + side * 250 * S, ey = CY + 40 * S;
  ctx.beginPath();
  for (let i = 0; i < 16; i++){
    const a = (i / 16) * Math.PI * 2;
    const r1 = 30 * S, r2 = 44 * S;
    ctx.moveTo(ex + side * 10 * S + Math.cos(a) * r1, ey - 4 * S + Math.sin(a) * r1);
    ctx.lineTo(ex + side * 10 * S + Math.cos(a) * r2, ey - 4 * S + Math.sin(a) * r2);
  }
}
function bindiPath(){
  const bx = CX, by = CY - 235 * S, w = 78 * S, h = 105 * S;
  ctx.beginPath();
  ctx.moveTo(bx, by - h);
  ctx.quadraticCurveTo(bx + w, by - h * 0.2, bx, by + h);
  ctx.quadraticCurveTo(bx - w, by - h * 0.2, bx, by - h);
}
function bindiRing(){
  ctx.beginPath();
  ctx.arc(CX, CY - 235 * S + 8 * S, 40 * S, 0, Math.PI * 2);
}
function nosePath(){
  const nx = CX, ny = CY + 265 * S;
  ctx.beginPath();
  ctx.moveTo(nx - 70 * S, ny);
  ctx.quadraticCurveTo(nx - 30 * S, ny + 6 * S, nx - 18 * S, ny - 22 * S);
  ctx.quadraticCurveTo(nx - 8 * S, ny - 44 * S, nx + 22 * S, ny - 40 * S);
  ctx.quadraticCurveTo(nx + 62 * S, ny - 34 * S, nx + 55 * S, ny + 8 * S);
  ctx.quadraticCurveTo(nx + 48 * S, ny + 42 * S, nx + 8 * S, ny + 40 * S);
  ctx.quadraticCurveTo(nx - 22 * S, ny + 38 * S, nx - 24 * S, ny + 12 * S);
}

const strokes = [
  { build: () => eyePath(-1),  color: '#ff2d95', core: '#ffd7ec', t0: 0.4, dur: 1.8 },
  { build: () => eyePath(1),   color: '#ff2d95', core: '#ffd7ec', t0: 1.2, dur: 1.8 },
  { build: () => browPath(-1), color: '#ff5a2d', core: '#ffe3c8', t0: 2.2, dur: 1.4 },
  { build: () => browPath(1),  color: '#ff5a2d', core: '#ffe3c8', t0: 2.6, dur: 1.4 },
  { build: () => irisPath(-1), color: '#ff7a3d', core: '#fff3dd', t0: 3.4, dur: 1.2 },
  { build: () => irisPath(1),  color: '#ff7a3d', core: '#fff3dd', t0: 3.7, dur: 1.2 },
  { build: () => irisGear(-1), color: '#ff2d55', core: '#ffc8d8', t0: 4.4, dur: 1.0, thin: true },
  { build: () => irisGear(1),  color: '#ff2d55', core: '#ffc8d8', t0: 4.6, dur: 1.0, thin: true },
  { build: () => bindiPath(),  color: '#ff2dc0', core: '#ffe0f5', t0: 5.2, dur: 1.6 },
  { build: () => bindiRing(),  color: '#ff2dc0', core: '#ffffff', t0: 6.0, dur: 1.0, thin: true },
  { build: () => nosePath(),   color: '#ffb52e', core: '#fff6dd', t0: 6.8, dur: 1.6 },
];

function neonFlicker(local){
  // real-tube stutter in first 25% of each stroke
  if (local < 0 || local > 0.25) return 1;
  const n = Math.sin(local * 90) * Math.sin(local * 47 + 1.3);
  return n > -0.2 ? 1 : 0.15;
}

function strokeNeon(st, progress, time){
  const local = Math.min(1, Math.max(0, progress));
  if (local <= 0) return;
  const flick = neonFlicker(local);
  const pulse = 0.85 + 0.15 * Math.sin(time * 2.2);
  const alpha = flick * (local < 1 ? 1 : pulse);
  const LEN = 2600 * S;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.setLineDash([LEN, LEN]);
  ctx.lineDashOffset = LEN * (1 - local);
  // halo
  ctx.shadowColor = st.color; ctx.shadowBlur = 34 * S * alpha;
  ctx.strokeStyle = st.color; ctx.globalAlpha = 0.85 * alpha;
  ctx.lineWidth = (st.thin ? 7 : 13) * S;
  st.build(); ctx.stroke();
  // tube
  ctx.shadowBlur = 16 * S * alpha;
  ctx.globalAlpha = 0.95 * alpha;
  ctx.lineWidth = (st.thin ? 4 : 7) * S;
  st.build(); ctx.stroke();
  // hot core
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1 * alpha;
  ctx.strokeStyle = st.core;
  ctx.lineWidth = (st.thin ? 1.6 : 2.6) * S;
  st.build(); ctx.stroke();
  ctx.restore();
}

function frame(now){
  if (!t0) t0 = now;
  const t = ((now - t0) / 1000) % CYCLE;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  // faint floor glow once bindi is lit
  const glowP = Math.min(1, Math.max(0, (t - 5.2) / 1.6));
  if (glowP > 0){
    const g = ctx.createRadialGradient(CX, CY, 10, CX, CY, 520 * S);
    g.addColorStop(0, 'rgba(255,60,150,' + (0.10 * glowP) + ')');
    g.addColorStop(1, 'rgba(255,60,150,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  for (const st of strokes){
    strokeNeon(st, (t - st.t0) / st.dur, t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* controls */
const tap = document.getElementById('tap');
tap.addEventListener('click', () => {
  tap.classList.add('hidden');
  if (!started){ started = true; t0 = null; }
});
// Embed mode (?embed=1): autoplay inside an iframe, no tap screen or buttons
try {
  const q = new URLSearchParams(window.location.search);
  if (q.get('embed') === '1' || q.get('autoplay') === '1'){
    document.body.classList.add('embed');
    tap.classList.add('hidden');
    started = true; t0 = null;
  }
} catch (e) {}
document.getElementById('replay').addEventListener('click', (e) => {
  e.stopPropagation(); t0 = null;
});
let recorder = null, chunks = [];
document.getElementById('rec').addEventListener('click', (e) => {
  e.stopPropagation();
  const btn = e.currentTarget;
  if (recorder){ recorder.stop(); return; }
  const stream = canvas.captureStream(60);
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find((m) => { try { return MediaRecorder.isTypeSupported(m); } catch (x) { return false; } });
  chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 20000000 } : undefined);
  recorder.ondataavailable = (ev) => { if (ev.data.size) chunks.push(ev.data); };
  recorder.onstop = () => {
    recorder = null; btn.textContent = 'EXPORT 12s VIDEO';
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'maa-durga-neon-reveal.webm'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  recorder.start(250);
  btn.textContent = 'STOP + DOWNLOAD';
  t0 = null; // restart reveal for a clean capture
  setTimeout(() => { if (recorder) recorder.stop(); }, 12500);
});
</script>
</body>
</html>
